<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <title>Night Shift</title>
  <defs>
    <mask id="hub"><rect width="100" height="100" fill="#fff"/><circle cx="50" cy="50" r="17" fill="#000"/></mask>
    <mask id="moon"><rect width="100" height="100" fill="#fff"/><circle cx="56" cy="45" r="9" fill="#000"/></mask>
  </defs>
  <rect width="100" height="100" rx="22" fill="#121833"/>
  <g mask="url(#hub)">
    <rect x="44" y="12" width="12" height="16" rx="2" fill="#F2E6C9" transform="rotate(0 50 50)"/>
    <rect x="44" y="12" width="12" height="16" rx="2" fill="#F2E6C9" transform="rotate(45 50 50)"/>
    <rect x="44" y="12" width="12" height="16" rx="2" fill="#F2E6C9" transform="rotate(90 50 50)"/>
    <rect x="44" y="12" width="12" height="16" rx="2" fill="#F2E6C9" transform="rotate(135 50 50)"/>
    <rect x="44" y="12" width="12" height="16" rx="2" fill="#F2E6C9" transform="rotate(180 50 50)"/>
    <rect x="44" y="12" width="12" height="16" rx="2" fill="#F2E6C9" transform="rotate(225 50 50)"/>
    <rect x="44" y="12" width="12" height="16" rx="2" fill="#F2E6C9" transform="rotate(270 50 50)"/>
    <rect x="44" y="12" width="12" height="16" rx="2" fill="#F2E6C9" transform="rotate(315 50 50)"/>
    <circle cx="50" cy="50" r="30" fill="#F2E6C9"/>
  </g>
  <circle cx="50" cy="50" r="11" fill="#FFB547" mask="url(#moon)"/>
</svg>
